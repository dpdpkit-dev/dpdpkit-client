# Release on tag vX.Y.Z (package.json version must match). Pre-release tags publish under the "next"
# dist-tag. Requires the NPM_TOKEN secret (or npm trusted publishing) — task SETUP-08.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "tag=next" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build && npm run check:generated
      - run: npm publish --provenance --access public --tag ${{ steps.v.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Release notes
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## " { if (found) exit; if (index($0, v)) { found=1; next } }
            found { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ steps.v.outputs.tag == 'next' }}
          files: sbom.spdx.json
