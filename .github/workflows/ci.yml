name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # vitest 5 needs Node 22.12+; older runtimes are covered by runtime-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated types match spec/openapi.yaml
        run: npm run check:generated
      - run: npm audit --audit-level=high --omit=dev
      - if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with: { name: dist, path: dist }

  # The published package supports Node 18+ (engines); the toolchain needs 22+. Load the built
  # output on the older runtimes without installing any dev dependencies.
  runtime-smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke.mjs

  spec-drift:
    # Warns when dpdpkit-spec main has moved ahead of the vendored copy.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/sync-spec.mjs main && git diff --exit-code -- spec/openapi.yaml
